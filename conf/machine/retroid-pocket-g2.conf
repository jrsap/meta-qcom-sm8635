#@TYPE: Machine
#@NAME: Retroid Pocket G2
#@DESCRIPTION: Machine configuration for the Retroid Pocket G2 (Snapdragon G2 Gen 2 / SM8635 "cliffs")

require conf/machine/include/qcom-sm8635.inc

# Track mainline development kernel; the sm8635/retroid-pocket-g2 support
# is carried as patches in recipes-kernel/linux/linux-yocto-dev/retroid-g2/
# (integration branch: vibe/retroid-g2-fef4cc in jrsap/linux-sm8635).
PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto-dev"

QCOM_DTB_DEFAULT ?= "sm8635-retroid-pocket-g2"

QCOM_UKI_DEVICETREE = "${QCOM_DTB_DEFAULT}.dtb"

KERNEL_DEVICETREE ?= " \
                      qcom/sm8635-retroid-pocket-g2.dtb \
                      "
